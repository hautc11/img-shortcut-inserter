<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 14px;
      width: 260px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { color: #666; margin: 0 0 12px; }
    button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #2b6cb0;
      color: white;
      cursor: pointer;
      font: inherit;
    }
    button:hover { opacity: 0.9; }
    .count { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Image Shortcut Paster</h1>
  <p><span class="count" id="count">0</span> cặp đã lưu.</p>
  <button id="openOptions">Mở trang cài đặt</button>
  <script src="popup.js"></script>
</body>
</html>
